name: reproduce

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: "Step 1: verify data checksums"
        run: ./step1_verify_data.sh
      - name: "Step 2: recompute results from per-event counts"
        run: ./step2_recompute_results.sh
      - name: "Step 3: compare with the paper"
        run: ./step3_compare_with_paper.sh
      - name: "Calibration extension: standalone recompute"
        run: python data/calibration_extension/recompute_results.py
      - name: Job summary
        if: always()
        run: test -f out/summary.md && cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: "Step 4: draw figures"
        run: |
          pip install -r tools/figures/requirements.txt
          ./step4_plot_figures.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: out/
